<script>
(function () {
  var have = ['en', 'tr', 'de', 'fr', 'es', 'it', 'pt', 'ru', 'pl', 'nl', 'sv', 'ja', 'ko', 'zh-hans', 'zh-hant', 'id', 'vi', 'fil', 'th'];
  var langs = navigator.languages || [navigator.language || 'en'];
  for (var i = 0; i < langs.length; i++) {
    var l = (langs[i] || '').toLowerCase(), code = null;
    if (l.indexOf('zh') === 0) code = /hant|tw|hk|mo/.test(l) ? 'zh-hant' : 'zh-hans';
    else if (l.indexOf('fil') === 0 || l.indexOf('tl') === 0) code = 'fil';
    else code = l.split('-')[0];
    if (have.indexOf(code) >= 0) { location.replace(code + '.html'); return; }
  }
  location.replace('en.html');
})();
</script>
